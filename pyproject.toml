[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scrape-hub"
version = "1.0.0"
description = "AI-agent-friendly web scraping CLI — multi-engine WeChat article search (Sogou + Bing/Baidu/360), full-content fetching, and X/Twitter search."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "hechenyu"},
]
keywords = ["scraping", "playwright", "wechat", "weixin", "twitter", "cli", "ai-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dependencies = [
    "playwright>=1.40",
]

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]

[project.scripts]
scrape-hub = "scrape_hub.__main__:main"

[tool.setuptools.packages.find]
include = ["scrape_hub*"]

[tool.ruff]
target-version = "py310"
line-length = 100
